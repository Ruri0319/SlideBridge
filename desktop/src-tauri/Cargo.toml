[package]
name = "ibl2svs-desktop"
version = "0.3.0"
description = "IBL/SVS/TIFF WSI converter"
authors = ["IBL2SVS"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ibl2svs_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
thiserror = "1"
