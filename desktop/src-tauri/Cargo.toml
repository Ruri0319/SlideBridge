[package]
name = "slidebridge-desktop"
version = "0.4.1"
description = "Universal whole-slide image converter"
authors = ["SlideBridge"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "slidebridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
thiserror = "1"
