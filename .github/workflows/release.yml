name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.3.0"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact_name: IBL2SVS-Windows-x64
            tauri_args: "--ci --bundles nsis"
            bundle_path: "desktop/src-tauri/target/release/bundle/nsis/*.exe"
          - label: macOS
            os: macos-latest
            artifact_name: IBL2SVS-macOS
            tauri_args: "--ci --bundles dmg --no-sign"
            bundle_path: "desktop/src-tauri/target/release/bundle/dmg/*.dmg"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup update stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Build Python worker sidecar
        shell: bash
        run: |
          python -m PyInstaller IBL2SVSWorker.spec --clean --noconfirm
          target_triple="$(rustc -vV | awk '/^host:/ { print $2 }')"
          mkdir -p desktop/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/ibl2svs-worker.exe "desktop/src-tauri/binaries/ibl2svs-worker-${target_triple}.exe"
          else
            cp dist/ibl2svs-worker "desktop/src-tauri/binaries/ibl2svs-worker-${target_triple}"
            chmod +x "desktop/src-tauri/binaries/ibl2svs-worker-${target_triple}"
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "IBL2SVS ${RELEASE_TAG}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
