name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update, for example v0.4.2"
        required: true
        type: string

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            artifact_name: SlideBridge-Windows-x64
            tauri_args: "--ci --bundles nsis"
            bundle_path: "desktop/src-tauri/target/release/bundle/nsis/*.exe"
          - label: macOS
            os: macos-latest
            artifact_name: SlideBridge-macOS
            tauri_args: "--ci --bundles dmg"
            bundle_path: "desktop/src-tauri/target/release/bundle/dmg/*.dmg"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Prepare Rust toolchain
        shell: bash
        run: |
          rustup default stable
          rustup update stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run Python tests
        run: python -m pytest tests -q

      - name: Build Python worker sidecar
        shell: bash
        run: |
          python -m PyInstaller SlideBridgeWorker.spec --clean --noconfirm
          target_triple="$(rustc -vV | awk '/^host:/ { print $2 }')"
          mkdir -p desktop/src-tauri/binaries
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp dist/slidebridge-worker.exe "desktop/src-tauri/binaries/slidebridge-worker-${target_triple}.exe"
          else
            cp dist/slidebridge-worker "desktop/src-tauri/binaries/slidebridge-worker-${target_triple}"
            chmod +x "desktop/src-tauri/binaries/slidebridge-worker-${target_triple}"
          fi

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri bundle
        working-directory: desktop
        run: npm run tauri build -- ${{ matrix.tauri_args }}

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg_path="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          test -n "$dmg_path"
          mount_path="$(mktemp -d)"
          trap 'hdiutil detach "$mount_path" >/dev/null 2>&1 || true; rmdir "$mount_path" 2>/dev/null || true' EXIT
          hdiutil attach "$dmg_path" -readonly -nobrowse -mountpoint "$mount_path" >/dev/null
          app_path="$mount_path/SlideBridge.app"
          worker_path="$app_path/Contents/MacOS/slidebridge-worker"
          file "$worker_path" | grep -q "Mach-O"
          worker_output="$(printf '{\"type\":\"ping\"}\n' | "$worker_path")"
          printf '%s\n' "$worker_output" | grep -q '"type": "ready"'
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS.txt

      - name: Create or update release
        shell: bash
        run: |
          mapfile -d '' files < <(find release-assets -type f -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber --repo "$GH_REPO"
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --title "SlideBridge ${RELEASE_TAG}" \
              --generate-notes \
              --target "$GITHUB_SHA" \
              --repo "$GH_REPO"
          fi
